name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            sync-api/package-lock.json

      # sync-api tem dependências próprias (express, mssql...) usadas pelos
      # testes dele, que rodam junto na suíte da raiz
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix sync-api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck:ci

      # Trava: falha só com teste falhando fora de scripts/test-baseline.json.
      # Supabase fictício (os testes não acessam o banco) e fuso de São Paulo,
      # o mesmo de quem roda a suíte localmente.
      - name: Tests
        run: npm run test:ci
        env:
          VITE_SUPABASE_URL: http://localhost
          VITE_SUPABASE_ANON_KEY: chave-ficticia-de-teste
          TZ: America/Sao_Paulo

      - name: Build
        run: npm run build
